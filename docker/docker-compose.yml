# ===========================================
# Wuji Hand Teleop Docker Compose
# ===========================================
#
# Prerequisites (host):
#   sudo apt-get install docker.io docker-compose-plugin
#   sudo usermod -aG docker $USER && newgrp docker
#   sudo apt-get install git-lfs && git lfs install && git lfs pull
#
# Usage:
#   cd docker
#   docker compose build                    # Build the image
#   docker compose up -d                    # Start the container
#   docker exec -it wuji-hand-teleop bash   # Open a shell inside
#
# Start teleop inside the container:
#   ros2 launch wuji_teleop_bringup wuji_teleop.launch.py
#
# Accelerate the build behind a slow PyPI mirror:
#   docker compose build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
#
# If Docker Hub is slow/unreachable, override the ROS base image too:
#   docker compose build \
#     --build-arg ROS_BASE_IMAGE=docker.1ms.run/osrf/ros:humble-desktop \
#     --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
#
# ===========================================

services:
  teleop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Optional build args for restricted networks:
      # args:
      #   ROS_BASE_IMAGE: docker.1ms.run/osrf/ros:humble-desktop
      #   PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: wuji-hand-teleop:latest
    container_name: wuji-hand-teleop
    # Auto-start on boot and after a crash, so a host reboot brings the teleop
    # container back without a manual `docker start`. 'unless-stopped' still
    # honors an explicit `docker stop` by the operator.
    restart: unless-stopped
    # --- Network & IPC ---
    network_mode: host                  # ROS2 DDS multi-host discovery
    ipc: host                           # ROS2 shared-memory transport
    pid: host                           # SteamVR IPC needs a shared PID namespace

    # Lets entrypoint.sh pin per-glove /32 routes when the harness wires each
    # glove receiver to a separate NIC on the same subnet (see
    # scripts/setup_glove_routes.sh). Editing the host routing table needs
    # NET_ADMIN; harmless on single-NIC setups where the script is a no-op.
    cap_add:
      - NET_ADMIN

    # --- PID 1 management ---
    # PC-Service runs as a background process; init reaps zombies + forwards signals.
    init: true

    # --- GPU (optional, NVENC hardware H.264 encoding) ---
    # Uncomment the block below when an NVIDIA GPU is available; host needs
    # nvidia-container-toolkit. Without GPU the build falls back to libx264
    # software encoding automatically (no functional change).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # --- Device access ---
    device_cgroup_rules:
      - 'c 81:* rmw'                   # video4linux (cameras)
      - 'c 189:* rmw'                  # USB (MANUS, RealSense)

    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Shanghai
      - HOST_HOME=${HOME}                  # used by SteamVR path resolution

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # GUI passthrough (rviz, rqt)
      - /dev:/dev:rw                       # device hot-plug
      - ../src:/home/wuji/ros2_ws/src:rw   # bind-mount the host source tree
      # --- Wuji Studio calibration ---
      # Studio 2026.7.14+ stores named-profile calibration under
      # ~/.wuji/sdk/users/<profile-id>/; the SDK reads the same active profile in
      # the container. entrypoint.sh repairs ownership if Docker created it as root.
      - ${HOME}/.wuji:/home/wuji/.wuji:rw
      # --- SteamVR / OpenVR (HTC Vive Tracker path only) ---
      # PICO-only users may comment this out or leave it (the empty dir is harmless).
      - ${HOME}/.steam:/home/wuji/.steam:ro

    # --- Log rotation (avoid filling disk during long runs) ---
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    user: wuji
    stdin_open: true
    tty: true
    command: bash
